<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuarryFlow Crossing — Simulation Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0c0f0d;
  color: #c8d4cc;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ───────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── Header ───────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 44px;
  background: #0f1210;
  border-bottom: 1px solid rgba(201,168,76,0.12);
  flex-shrink: 0;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.25), transparent);
}
.header h1 {
  font-size: 13px;
  font-weight: 600;
  color: #e8e0d0;
  letter-spacing: 0.04em;
}
.header h1 .accent { color: #c9a84c; font-weight: 700; }
.header h1 .dim { color: #7a8a7e; font-weight: 400; }
.header-controls {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ── Canvas Area ──────────────────────────────────────────── */
.canvas-area {
  flex: 1;
  display: flex;
  gap: 0;
  overflow: hidden;
  position: relative;
  background: #080b09;
}
.canvas-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  border-right: 1px solid rgba(201,168,76,0.06);
}
.canvas-panel:last-child { border-right: none; }
.canvas-panel .policy-label {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(12,15,13,0.92);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 3px;
  padding: 3px 14px;
  font-size: 11px;
  font-weight: 600;
  color: #c9a84c;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  z-index: 10;
  pointer-events: none;
}
.canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── HUD ──────────────────────────────────────────────────── */
.hud {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  pointer-events: none;
  z-index: 10;
}
.hud-primary {
  display: flex;
  gap: 14px;
  align-items: center;
  background: rgba(12,15,13,0.92);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 3px;
  padding: 5px 12px;
  margin-bottom: 3px;
  font-size: 12px;
  font-weight: 500;
}
.hud-primary .time {
  color: #c9a84c;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 13px;
}
.hud-primary .barrier-open { color: #55c98a; }
.hud-primary .barrier-closed { color: #d45555; }
.hud-secondary {
  display: flex;
  gap: 16px;
  background: rgba(12,15,13,0.78);
  border: 1px solid rgba(201,168,76,0.06);
  border-radius: 3px;
  padding: 3px 10px;
  font-size: 10px;
  color: #6a8a72;
  letter-spacing: 0.02em;
}
.hud-secondary .metric-val { color: #b8d4c0; font-weight: 600; }
.hud-secondary .risk-high { color: #d45555; }
.hud-sep {
  width: 1px;
  height: 12px;
  background: rgba(201,168,76,0.15);
  flex-shrink: 0;
}
.disorder-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: relative;
  min-width: 100px;
}
.disorder-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: linear-gradient(90deg, rgba(255,140,60,0.15), rgba(255,64,64,0.25));
  border-radius: 2px;
  transition: width 0.2s ease;
}
.disorder-text {
  position: relative;
  z-index: 1;
  font-size: 11px;
  font-weight: 500;
  color: #a0b0a4;
  white-space: nowrap;
}
.disorder-text.high { color: #ff8c3c; }
.disorder-text.critical { color: #ff4040; }

/* ── Controls Bar ─────────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: #0f1210;
  border-top: 1px solid rgba(201,168,76,0.12);
  flex-shrink: 0;
  position: relative;
}
.controls::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
}
.controls button {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.15);
  color: #a0b0a4;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.controls button:hover {
  background: rgba(201,168,76,0.12);
  color: #d4c8a0;
  border-color: rgba(201,168,76,0.25);
}
.controls button.active {
  background: rgba(201,168,76,0.18);
  border-color: #c9a84c;
  color: #e8dcc0;
}
.controls button:disabled { opacity: 0.25; cursor: default; }

.speed-slider-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.speed-slider-group input[type="range"] {
  width: 72px;
  height: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(201,168,76,0.12);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.speed-slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #c9a84c;
  border: 2px solid #0c0f0d;
  cursor: pointer;
}
.speed-slider-group input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #c9a84c;
  border: 2px solid #0c0f0d;
  cursor: pointer;
}
.speed-label {
  font-size: 10px;
  color: #c9a84c;
  font-weight: 600;
  min-width: 28px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em;
}
.scrubber-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}
.scrubber {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(201,168,76,0.1);
  border-radius: 2px;
  outline: none;
}
.scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #c9a84c;
  cursor: pointer;
  border: 2px solid #0c0f0d;
}
.scrubber::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #c9a84c;
  cursor: pointer;
  border: 2px solid #0c0f0d;
}
.time-display {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: #6a8a72;
  min-width: 85px;
  text-align: right;
  letter-spacing: 0.02em;
}

/* ── Selectors ────────────────────────────────────────────── */
select {
  background: rgba(201,168,76,0.05);
  border: 1px solid rgba(201,168,76,0.15);
  color: #a0b0a4;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}
select:hover { border-color: rgba(201,168,76,0.25); }
select option { background: #0f1210; color: #a0b0a4; }

/* ── Legend ────────────────────────────────────────────────── */
.legend {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 10px;
  color: #6a8a72;
  letter-spacing: 0.04em;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}
.legend-swatch {
  width: 20px;
  height: 10px;
  border-radius: 2px;
  position: relative;
}
.legend-sep {
  width: 1px;
  height: 14px;
  background: rgba(201,168,76,0.15);
  margin: 0 2px;
}

/* ── Debug Toggle ─────────────────────────────────────────── */
.debug-toggle {
  font-size: 10px;
  color: #6a8a72;
  cursor: pointer;
  user-select: none;
  letter-spacing: 0.04em;
}
.debug-toggle:hover { color: #a0b0a4; }

/* ── Empty State ──────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  text-align: center;
  padding: 40px;
}
.empty-state .empty-icon {
  width: 56px; height: 56px;
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #c9a84c;
  background: rgba(201,168,76,0.04);
  margin-bottom: 4px;
}
.empty-state h2 {
  font-size: 16px;
  font-weight: 600;
  color: #a0b0a4;
  letter-spacing: 0.02em;
}
.empty-state p {
  font-size: 12px;
  color: #5a7a62;
  max-width: 380px;
  line-height: 1.7;
}
.empty-state code {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.1);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 11px;
  color: #c9a84c;
  font-family: 'SF Mono', 'Consolas', monospace;
}

/* ── File Input ───────────────────────────────────────────── */
.file-input-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.15);
  color: #a0b0a4;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.file-input-label:hover {
  background: rgba(201,168,76,0.12);
  border-color: rgba(201,168,76,0.25);
}
.slider-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.slider-label {
  font-size: 9px;
  color: #5a7a62;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  min-width: 36px;
}
.slider-group input[type="range"] {
  width: 52px;
  height: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(201,168,76,0.12);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #c9a84c;
  border: 1.5px solid #0c0f0d;
  cursor: pointer;
}
.slider-group input[type="range"]::-moz-range-thumb {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #c9a84c;
  border: 1.5px solid #0c0f0d;
  cursor: pointer;
}
.slider-value {
  font-size: 9px;
  color: #c9a84c;
  font-weight: 600;
  min-width: 24px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ── Comparison Badge ─────────────────────────────────────── */
.comparison-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(12,15,13,0.92);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 3px;
  padding: 3px 10px;
  font-size: 10px;
  font-weight: 600;
  color: #c9a84c;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1><span class="accent">QF</span> QuarryFlow Crossing <span class="dim">| Simulation Visualizer</span></h1>
    <div class="header-controls">
      <div class="legend">
        <div class="legend-item">
          <svg class="legend-swatch" viewBox="0 0 22 10">
            <rect x="1" y="2" width="20" height="6" rx="2" fill="#55c98a"/>
            <rect x="4" y="3" width="5" height="3" rx="1" fill="#3a8a5c" opacity="0.6"/>
            <circle cx="5" cy="2" r="1" fill="#f0e8c0" opacity="0.8"/>
            <circle cx="17" cy="2" r="0.8" fill="#d44040" opacity="0.8"/>
          </svg>
          Car
        </div>
        <div class="legend-item">
          <svg class="legend-swatch" viewBox="0 0 22 10">
            <ellipse cx="11" cy="5" rx="5" ry="3" fill="#4db8d4"/>
            <circle cx="6" cy="5" r="1.5" fill="#1a5a6a" opacity="0.6"/>
            <circle cx="16" cy="5" r="1.5" fill="#1a5a6a" opacity="0.6"/>
            <ellipse cx="9" cy="4" rx="2" ry="1.5" fill="#151f1a"/>
          </svg>
          Bike
        </div>
        <div class="legend-item">
          <svg class="legend-swatch" viewBox="0 0 22 10">
            <rect x="1" y="2" width="12" height="6" rx="1.5" fill="#7a6020"/>
            <rect x="11" y="3" width="10" height="4" rx="1.5" fill="#c9a84c"/>
            <circle cx="20" cy="3" r="1" fill="#f0e8c0" opacity="0.8"/>
          </svg>
          Auto
        </div>
        <div class="legend-sep"></div>
        <div class="legend-item">
          <svg class="legend-swatch" viewBox="0 0 10 10">
            <circle cx="5" cy="5" r="4" fill="none" stroke="#ff8c3c" stroke-width="1.5" opacity="0.7"/>
            <circle cx="5" cy="5" r="1.5" fill="#ff8c3c" opacity="0.5"/>
          </svg>
          Overtaking
        </div>
        <div class="legend-item">
          <svg class="legend-swatch" viewBox="0 0 10 10">
            <rect x="1" y="1" width="8" height="8" rx="1" fill="none" stroke="#ff4040" stroke-width="1.5" opacity="0.7"/>
          </svg>
          Wrong Side
        </div>
      </div>
      <label class="debug-toggle"><input type="checkbox" id="debugToggle"> Debug</label>
    </div>
  </div>

  <!-- Canvas Area -->
  <div class="canvas-area" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#9673;</div>
      <h2>No simulation data loaded</h2>
      <p>Use <strong>Load Files</strong> below to open exported JSON files, or drag them onto this area.</p>
      <p><code>python scripts/export_viz.py --scenario peak --fast</code></p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btnPlay" title="Play/Pause (Space)">&#9654;</button>
    <div class="speed-slider-group">
      <input type="range" id="speedSlider" min="0" max="7" value="5" step="1" title="Playback speed">
      <span class="speed-label" id="speedLabel">1x</span>
    </div>
    <button id="btnStepBack" title="Step Back (Left Arrow)">&#9664;</button>
    <button id="btnStepFwd" title="Step Forward (Right Arrow)">&#9654;</button>
    <div class="scrubber-wrap">
      <input type="range" class="scrubber" id="scrubber" min="0" max="100" value="0" step="1">
      <div class="time-display" id="timeDisplay">0.0s / 0.0s</div>
    </div>
    <select id="scenarioSelect">
      <option value="">Select scenario...</option>
    </select>
    <select id="policySelect">
      <option value="">Select policy...</option>
    </select>
    <select id="policySelect2" style="display:none">
      <option value="">Compare with...</option>
    </select>
    <button id="btnCompare" title="Toggle comparison mode">Compare</button>
    <label class="file-input-label" title="Load one or more JSON files">
      Load Files
      <input type="file" id="fileInput" accept=".json" multiple style="display:none">
    </label>
    <div class="slider-group">
      <label class="slider-label">Road</label>
      <input type="range" id="roadSizeSlider" min="5" max="20" value="10" step="1" title="Road width (visual only)">
      <span class="slider-value" id="roadSizeLabel">1.0x</span>
    </div>
    <div class="slider-group">
      <label class="slider-label">Vehicles</label>
      <input type="range" id="vehicleSizeSlider" min="5" max="20" value="10" step="1" title="Vehicle size (visual only)">
      <span class="slider-value" id="vehicleSizeLabel">1.0x</span>
    </div>
  </div>
</div>

<script>
// ================================================================
//  Constants
// ================================================================
const COLORS = {
  bg: '#080b09',
  road: '#121815',
  roadEdge: 'rgba(201,168,76,0.08)',
  laneDash: 'rgba(201,168,76,0.07)',
  laneDashYellow: 'rgba(201,168,76,0.18)',
  crossingBox: 'rgba(201,168,76,0.04)',
  crossingBorder: 'rgba(201,168,76,0.2)',
  crossingHatch: 'rgba(201,168,76,0.06)',
  disorderZone: 'rgba(212,85,85,0.025)',
  disorderBorder: 'rgba(212,85,85,0.08)',
  barrierOpen: '#55c98a',
  barrierClosed: '#d45555',
  barrierWarning: '#c9a84c',
  vehicle: { car: '#55c98a', bike: '#3dd8f0', auto: '#e8b830' },
  vehicleDark: { car: '#2a6a42', bike: '#1880a0', auto: '#a07810' },
  vehicleLight: { car: '#7aeab0', bike: '#80e8ff', auto: '#f0d860' },
  vehicleStroke: '#0a0e0c',
  headlight: '#f0e8c0',
  taillight: '#d44040',
  decisionFlash: 'rgba(201,168,76,0.2)',
  shadow: 'rgba(0,0,0,0.35)',
  rail: '#8a8a8a',
  railHighlight: '#b0b0b0',
  railShadow: '#555555',
  ballast: '#3a3530',
  ballastLight: '#4a4540',
  trainBody: '#1a3050',
  trainBodyLight: '#254060',
  trainBodyDark: '#0e1e30',
  trainRoof: '#0c1825',
  trainStripe: '#e8b830',
  trainWindow: '#4a8ab0',
};

const VEHICLE_SIZES = {
  car:  { w: 10, h: 4 },
  bike: { w: 8,  h: 3.5 },
  auto: { w: 9,  h: 4 },
};

const GEOMETRY = {
  approachLength: 100.0,
  crossingBoxLength: 12.0,     // matches simulation (crossing_box_length=12.0)
  disorderZoneLength: 15.0,
  recoveryLength: 80.0,
  roadHalfWidth: 4.2,     // half-width of road surface
  laneWidth: 2.0,         // width of each lane
  get halfBox() { return this.crossingBoxLength / 2; },
  get totalLength() { return this.approachLength + this.crossingBoxLength + this.recoveryLength; },
  get canvasXMin() { return -(this.approachLength + this.crossingBoxLength / 2 + this.recoveryLength - 20); },
  get canvasXMax() { return this.approachLength + this.crossingBoxLength / 2 + this.recoveryLength - 20; },
  canvasYMin: -10.0,
  canvasYMax: 10.0,
};

// ================================================================
//  State
// ================================================================
const state = {
  data: null,
  data2: null,
  frameIndex: 0,
  fractionalFrame: 0,
  playing: false,
  speed: 1,
  showDebug: false,
  compareMode: false,
  scenarios: {},
  decisionFlashTime: -10,
  lastAction: null,
  conflictFlashTime: -10,
  roadScale: 1.0,       // visual road width multiplier
  vehicleScale: 1.0,    // visual vehicle size multiplier
  // Train state (visual overlay, not simulation data)
  // Dynamically generates freight cars so the train fills the entire barrier closure.
  // Cars feed from a fixed entry point just off-screen. The last car clears the
  // crossing a few moments before the barrier opens.
  train: {
    active: false,        // is train currently visible
    y: 0,                 // train front position along tracks (world coords, Y axis)
    direction: 1,         // 1 = south-to-north (+Y), -1 = north-to-south (-Y)
    speed: 20,            // world units/sec — balanced for smooth freight flow
    carLength: 8,         // length of each freight car
    engineLength: 12,     // length of locomotive
    numCars: 1,           // starts with engine only, grows dynamically
    get totalLength() { return this.engineLength + (this.numCars - 1) * this.carLength; },
    genTimer: 0,          // counts UP toward genInterval, then adds a car
    genInterval: 0.4,     // seconds between car generation (= carLength / speed)
    entryY: -25,          // fixed Y where new cars emerge (just off-screen south)
    elapsedTime: 0,       // seconds since train started moving
    stopGenTime: 12,      // when to stop generating cars (calculated at spawn)
    generationDone: false, // true once stopGenTime is reached
  },
  lastRenderTime: 0,      // for dt calculation in train update
  // Collision effects
  collisions: [],          // active crash effects: [{x, y, time, word, id}]

  barrierViolations: 0,   // counter for barrier violations this session
};

// ================================================================
//  DOM Elements
// ================================================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const canvasArea = $('#canvasArea');
const emptyState = $('#emptyState');
const btnPlay = $('#btnPlay');
const scrubber = $('#scrubber');
const timeDisplay = $('#timeDisplay');
const scenarioSelect = $('#scenarioSelect');
const policySelect = $('#policySelect');
const policySelect2 = $('#policySelect2');
const btnCompare = $('#btnCompare');
const debugToggle = $('#debugToggle');
const speedSlider = $('#speedSlider');
const speedLabel = $('#speedLabel');
const roadSizeSlider = $('#roadSizeSlider');
const roadSizeLabel = $('#roadSizeLabel');
const vehicleSizeSlider = $('#vehicleSizeSlider');
const vehicleSizeLabel = $('#vehicleSizeLabel');

let canvases = [];
let animFrame = null;
let lastTick = 0;

// ================================================================
//  Canvas Setup
// ================================================================
function createCanvasPanels(count) {
  canvases = [];
  canvasArea.innerHTML = '';
  emptyState.style.display = 'none';

  for (let i = 0; i < count; i++) {
    const panel = document.createElement('div');
    panel.className = 'canvas-panel';

    const label = document.createElement('div');
    label.className = 'policy-label';
    label.textContent = '\u2014';
    panel.appendChild(label);

    const wrap = document.createElement('div');
    wrap.className = 'canvas-wrap';
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    panel.appendChild(wrap);

    const hud = document.createElement('div');
    hud.className = 'hud';
    hud.innerHTML = `
      <div class="hud-primary">
        <span class="time">0.0s</span>
        <span class="barrier-open">\u25cf Barrier Open</span>
        <span class="hud-sep"></span>
        <span class="disorder-indicator" data-hud="disorderBar">
          <span class="disorder-fill" style="width:0%"></span>
          <span class="disorder-text">Disorder: 0.00</span>
        </span>
      </div>
      <div class="hud-secondary">
        <span>L Queue: <span class="metric-val" data-hud="queueLeft">0</span></span>
        <span>R Queue: <span class="metric-val" data-hud="queueRight">0</span></span>
        <span>Wrong Side: <span class="metric-val" data-hud="wrongSide">0.00</span></span>
        <span>Risk: <span class="metric-val" data-hud="risk">0.00</span></span>
        <span data-hud="debug" style="display:none">Vehicles: <span class="metric-val" data-hud="debugInfo">\u2014</span></span>
      </div>
    `;
    panel.appendChild(hud);
    canvasArea.appendChild(panel);

    const ctx = canvas.getContext('2d');
    canvases.push({ canvas, ctx, panel, label });
  }

  resizeCanvases();
}

function resizeCanvases() {
  for (const c of canvases) {
    const wrap = c.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    c.canvas.width = w * dpr;
    c.canvas.height = h * dpr;
    c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.w = w;
    c.h = h;
  }
}

window.addEventListener('resize', () => {
  resizeCanvases();
  render();
});

// ================================================================
//  Coordinate Mapping
// ================================================================
function mapX(progress, side) {
  const offset = progress - GEOMETRY.approachLength - GEOMETRY.halfBox;
  return side === 'left' ? offset : -offset;
}

function mapY(lateralOffset, side) {
  // Lane centers scale with road width so vehicles stay centered when road resizes
  const laneCenter = 1.6 * state.roadScale;
  return (side === 'left' ? laneCenter : -laneCenter) + lateralOffset;
}

function worldToCanvas(wx, wy, cw, ch) {
  const xRange = GEOMETRY.canvasXMax - GEOMETRY.canvasXMin;
  const yRange = GEOMETRY.canvasYMax - GEOMETRY.canvasYMin;
  const scale = Math.min(cw / xRange, ch / yRange) * 0.92;
  const cx = cw / 2;
  const cy = ch / 2;
  const midX = (GEOMETRY.canvasXMax + GEOMETRY.canvasXMin) / 2;
  const midY = (GEOMETRY.canvasYMax + GEOMETRY.canvasYMin) / 2;
  return {
    x: cx + (wx - midX) * scale,
    y: cy - (wy - midY) * scale,
    s: scale,
  };
}

// ================================================================
//  Texture Generation
// ================================================================
let _asphaltPattern = null;
let _ballastPattern = null;

function createAsphaltTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const cx = c.getContext('2d');
  cx.fillStyle = '#151c18';
  cx.fillRect(0, 0, 128, 128);
  // Grain noise
  const imgData = cx.getImageData(0, 0, 128, 128);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 14;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  cx.putImageData(imgData, 0, 0);
  // Subtle cracks
  cx.strokeStyle = 'rgba(0,0,0,0.12)';
  cx.lineWidth = 0.5;
  for (let i = 0; i < 6; i++) {
    cx.beginPath();
    let x = Math.random() * 128, y = Math.random() * 128;
    cx.moveTo(x, y);
    for (let j = 0; j < 4; j++) {
      x += (Math.random() - 0.5) * 40;
      y += (Math.random() - 0.5) * 40;
      cx.lineTo(x, y);
    }
    cx.stroke();
  }
  return cx.createPattern(c, 'repeat');
}

function createBallastTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const cx = c.getContext('2d');
  cx.fillStyle = COLORS.ballast;
  cx.fillRect(0, 0, 64, 64);
  // Gravel stones
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * 64;
    const y = Math.random() * 64;
    const r = 1 + Math.random() * 2.5;
    const bright = 0.6 + Math.random() * 0.4;
    cx.fillStyle = `rgba(${Math.floor(60*bright)},${Math.floor(55*bright)},${Math.floor(48*bright)},0.7)`;
    cx.beginPath();
    cx.ellipse(x, y, r, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
    cx.fill();
  }
  return cx.createPattern(c, 'repeat');
}

function getAsphaltPattern(ctx) {
  if (!_asphaltPattern) _asphaltPattern = createAsphaltTexture();
  return _asphaltPattern;
}

function getBallastPattern(ctx) {
  if (!_ballastPattern) _ballastPattern = createBallastTexture();
  return _ballastPattern;
}

// ================================================================
//  Road Rendering
// ================================================================
function drawRoad(ctx, cw, ch) {
  const s = worldToCanvas(0, 0, cw, ch).s;
  const rhw = GEOMETRY.roadHalfWidth * state.roadScale;

  // Road surface with asphalt texture
  const roadTop = worldToCanvas(0, rhw, cw, ch);
  const roadBot = worldToCanvas(0, -rhw, cw, ch);
  const roadGrad = ctx.createLinearGradient(0, roadTop.y, 0, roadBot.y);
  roadGrad.addColorStop(0, '#101613');
  roadGrad.addColorStop(0.15, '#141a17');
  roadGrad.addColorStop(0.5, '#161d19');
  roadGrad.addColorStop(0.85, '#141a17');
  roadGrad.addColorStop(1, '#101613');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, roadTop.y, cw, roadBot.y - roadTop.y);

  // Asphalt grain texture overlay
  const asphalt = getAsphaltPattern(ctx);
  if (asphalt) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = asphalt;
    ctx.fillRect(0, roadTop.y, cw, roadBot.y - roadTop.y);
    ctx.restore();
  }

  // Road edge lines (subtle gold)
  ctx.strokeStyle = COLORS.roadEdge;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, roadTop.y); ctx.lineTo(cw, roadTop.y);
  ctx.moveTo(0, roadBot.y); ctx.lineTo(cw, roadBot.y);
  ctx.stroke();

  // Shoulder/rumble strips (very subtle texture near edges)
  const shoulderTop = worldToCanvas(0, rhw - 0.3, cw, ch);
  const shoulderBot = worldToCanvas(0, -rhw + 0.3, cw, ch);
  ctx.strokeStyle = 'rgba(201,168,76,0.03)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([2 * s, 2 * s]);
  ctx.beginPath();
  ctx.moveTo(0, shoulderTop.y); ctx.lineTo(cw, shoulderTop.y);
  ctx.moveTo(0, shoulderBot.y); ctx.lineTo(cw, shoulderBot.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Center double-dashed line (yellow tint, wider gap for 4-lane feel)
  const center = worldToCanvas(0, 0, cw, ch);
  ctx.setLineDash([5 * s, 3 * s]);
  ctx.strokeStyle = COLORS.laneDashYellow;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, center.y - 1.5);
  ctx.lineTo(cw, center.y - 1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, center.y + 1.5);
  ctx.lineTo(cw, center.y + 1.5);
  ctx.stroke();
  ctx.setLineDash([]);

  // Lane divider lines (subtle, between lanes on each side)
  const laneDivTop = worldToCanvas(0, rhw * 0.5, cw, ch);
  const laneDivBot = worldToCanvas(0, -rhw * 0.5, cw, ch);
  ctx.setLineDash([4 * s, 3 * s]);
  ctx.strokeStyle = 'rgba(201,168,76,0.04)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, laneDivTop.y); ctx.lineTo(cw, laneDivTop.y);
  ctx.moveTo(0, laneDivBot.y); ctx.lineTo(cw, laneDivBot.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Crossing box (wider to match road)
  const boxLeft = worldToCanvas(-GEOMETRY.halfBox, rhw, cw, ch);
  const boxRight = worldToCanvas(GEOMETRY.halfBox, -rhw, cw, ch);
  const boxW = boxRight.x - boxLeft.x;
  const boxH = boxRight.y - boxLeft.y;

  // Crossing fill with ballast texture
  ctx.fillStyle = '#1a1e1b';
  ctx.fillRect(boxLeft.x, boxLeft.y, boxW, boxH);
  const ballast = getBallastPattern(ctx);
  if (ballast) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = ballast;
    ctx.fillRect(boxLeft.x, boxLeft.y, boxW, boxH);
    ctx.restore();
  }

  // Railroad tracks (two rails running VERTICALLY across the road, perpendicular to traffic)
  // Track gauge: standard ~1.435m, scaled to ~1.4 world units, centered on crossing
  const trackGauge = 1.4;
  const railWidth = 2.5 * s;
  // Left rail (at x = -trackGauge/2 from crossing center)
  const railX1 = worldToCanvas(-trackGauge / 2, 0, cw, ch).x;
  // Right rail (at x = +trackGauge/2 from crossing center)
  const railX2 = worldToCanvas(trackGauge / 2, 0, cw, ch).x;
  // Extend tracks beyond crossing vertically
  const trackTop = worldToCanvas(0, GEOMETRY.roadHalfWidth * state.roadScale + 6, cw, ch).y;
  const trackBot = worldToCanvas(0, -(GEOMETRY.roadHalfWidth * state.roadScale + 6), cw, ch).y;

  // Rail shadow
  ctx.fillStyle = COLORS.railShadow;
  ctx.fillRect(railX1 + 1.5 * s, trackTop, railWidth + 1 * s, trackBot - trackTop);
  ctx.fillRect(railX2 + 1.5 * s, trackTop, railWidth + 1 * s, trackBot - trackTop);

  // Rail body
  ctx.fillStyle = COLORS.rail;
  ctx.fillRect(railX1, trackTop, railWidth, trackBot - trackTop);
  ctx.fillRect(railX2, trackTop, railWidth, trackBot - trackTop);

  // Rail highlight (left edge)
  ctx.fillStyle = COLORS.railHighlight;
  ctx.fillRect(railX1, trackTop, 1 * s, trackBot - trackTop);
  ctx.fillRect(railX2, trackTop, 1 * s, trackBot - trackTop);

  // Wooden sleepers/ties under tracks (horizontal planks across both rails)
  ctx.fillStyle = '#3a2e22';
  const sleeperSpacing = 5 * s;
  const sleeperPad = 3 * s;
  for (let y = boxLeft.y - 15 * s; y < boxRight.y + 15 * s; y += sleeperSpacing) {
    ctx.fillRect(railX1 - sleeperPad, y, (railX2 - railX1) + 2 * sleeperPad, 2.5 * s);
  }
  // Sleepers under extended tracks (above crossing)
  for (let y = trackTop; y < boxLeft.y; y += sleeperSpacing) {
    ctx.fillRect(railX1 - sleeperPad, y, (railX2 - railX1) + 2 * sleeperPad, 2.5 * s);
  }
  // Sleepers under extended tracks (below crossing)
  for (let y = boxRight.y; y < trackBot; y += sleeperSpacing) {
    ctx.fillRect(railX1 - sleeperPad, y, (railX2 - railX1) + 2 * sleeperPad, 2.5 * s);
  }

  // Hazard hatching inside crossing (diagonal warning stripes)
  ctx.save();
  ctx.beginPath();
  ctx.rect(boxLeft.x, boxLeft.y, boxW, boxH);
  ctx.clip();
  ctx.strokeStyle = COLORS.crossingHatch;
  ctx.lineWidth = 0.8;
  const hatchSpacing = 5 * s;
  for (let i = -25; i < 50; i++) {
    const xOff = boxLeft.x + i * hatchSpacing;
    ctx.beginPath();
    ctx.moveTo(xOff, boxLeft.y);
    ctx.lineTo(xOff + boxH * 0.6, boxRight.y);
    ctx.stroke();
  }
  // Reverse hatching
  for (let i = -25; i < 50; i++) {
    const xOff = boxLeft.x + i * hatchSpacing + hatchSpacing * 0.5;
    ctx.beginPath();
    ctx.moveTo(xOff, boxRight.y);
    ctx.lineTo(xOff + boxH * 0.6, boxLeft.y);
    ctx.stroke();
  }
  ctx.restore();

  // Crossing border (thicker, more prominent)
  ctx.strokeStyle = COLORS.crossingBorder;
  ctx.lineWidth = 2;
  ctx.strokeRect(boxLeft.x, boxLeft.y, boxW, boxH);

  // Crossing center marking
  ctx.setLineDash([3 * s, 2 * s]);
  ctx.strokeStyle = 'rgba(201,168,76,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(boxLeft.x, center.y);
  ctx.lineTo(boxRight.x, center.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Stop lines at crossing edges
  ctx.strokeStyle = 'rgba(201,168,76,0.15)';
  ctx.lineWidth = 1.5;
  // Left stop line
  ctx.beginPath();
  ctx.moveTo(boxLeft.x, boxLeft.y);
  ctx.lineTo(boxLeft.x, boxRight.y);
  ctx.stroke();
  // Right stop line
  ctx.beginPath();
  ctx.moveTo(boxRight.x, boxLeft.y);
  ctx.lineTo(boxRight.x, boxRight.y);
  ctx.stroke();

  // Disorder zones (subtle red gradient)
  const dzLeft = worldToCanvas(-GEOMETRY.approachLength, rhw, cw, ch);
  const dzLeftEnd = worldToCanvas(-GEOMETRY.approachLength + GEOMETRY.disorderZoneLength, -rhw, cw, ch);
  const dzGrad1 = ctx.createLinearGradient(dzLeft.x, 0, dzLeftEnd.x, 0);
  dzGrad1.addColorStop(0, 'rgba(212,85,85,0.005)');
  dzGrad1.addColorStop(1, 'rgba(212,85,85,0.03)');
  ctx.fillStyle = dzGrad1;
  ctx.fillRect(dzLeft.x, dzLeft.y, dzLeftEnd.x - dzLeft.x, dzLeftEnd.y - dzLeft.y);
  ctx.strokeStyle = COLORS.disorderBorder;
  ctx.lineWidth = 0.5;
  ctx.strokeRect(dzLeft.x, dzLeft.y, dzLeftEnd.x - dzLeft.x, dzLeftEnd.y - dzLeft.y);

  const dzRight = worldToCanvas(GEOMETRY.approachLength + GEOMETRY.crossingBoxLength, rhw, cw, ch);
  const dzRightEnd = worldToCanvas(GEOMETRY.approachLength + GEOMETRY.crossingBoxLength - GEOMETRY.disorderZoneLength, -rhw, cw, ch);
  const dzGrad2 = ctx.createLinearGradient(dzRight.x, 0, dzRightEnd.x, 0);
  dzGrad2.addColorStop(0, 'rgba(212,85,85,0.03)');
  dzGrad2.addColorStop(1, 'rgba(212,85,85,0.005)');
  ctx.fillStyle = dzGrad2;
  ctx.fillRect(dzRight.x, dzRight.y, dzRightEnd.x - dzRight.x, dzRightEnd.y - dzRight.y);
  ctx.strokeStyle = COLORS.disorderBorder;
  ctx.strokeRect(dzRight.x, dzRight.y, dzRightEnd.x - dzRight.x, dzRightEnd.y - dzRight.y);

  // Direction labels
  ctx.fillStyle = 'rgba(201,168,76,0.18)';
  ctx.font = `500 ${Math.max(8, 9 * s)}px 'Albert Sans', sans-serif`;
  ctx.textAlign = 'center';
  const leftLabel = worldToCanvas(-GEOMETRY.approachLength / 2, rhw - 0.5, cw, ch);
  ctx.fillText('\u2190 LEFT', leftLabel.x, leftLabel.y);
  const rightLabel = worldToCanvas(GEOMETRY.approachLength + GEOMETRY.crossingBoxLength + GEOMETRY.recoveryLength / 2, -rhw + 0.5, cw, ch);
  ctx.fillText('RIGHT \u2192', rightLabel.x, rightLabel.y);
  const boxLabel = worldToCanvas(0, rhw - 0.5, cw, ch);
  ctx.fillStyle = 'rgba(201,168,76,0.3)';
  ctx.fillText('\u26a1 CROSSING', boxLabel.x, boxLabel.y);

  // Ambient glow at crossing center
  const centerPt = worldToCanvas(0, 0, cw, ch);
  const glowRadius = 35 * s;
  const glow = ctx.createRadialGradient(centerPt.x, centerPt.y, 0, centerPt.x, centerPt.y, glowRadius);
  glow.addColorStop(0, 'rgba(201,168,76,0.025)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(centerPt.x - glowRadius, centerPt.y - glowRadius, glowRadius * 2, glowRadius * 2);
}

// ================================================================
//  Barrier Rendering
// ================================================================
function drawBarrier(ctx, cw, ch, closed, flashTime, now, barrierValue) {
  const rhw = GEOMETRY.roadHalfWidth * state.roadScale;
  const boxLeft = worldToCanvas(-GEOMETRY.halfBox, rhw, cw, ch);
  const boxRight = worldToCanvas(GEOMETRY.halfBox, -rhw, cw, ch);
  const centerY = worldToCanvas(0, 0, cw, ch).y;
  const s = boxLeft.s;
  const armLen = Math.abs(centerY - boxLeft.y);

  let armColor = closed ? COLORS.barrierClosed : COLORS.barrierOpen;
  let alpha = 1.0;

  // Warning flash when transitioning
  if (!closed && now - flashTime < 0.5) {
    const pulse = Math.sin((now - flashTime) * 14) * 0.5 + 0.5;
    armColor = COLORS.barrierWarning;
    alpha = 0.5 + pulse * 0.5;
  }

  ctx.save();
  ctx.globalAlpha = alpha;

  // ── Metal posts with cylindrical gradient ──
  const postR = 3.5 * s;

  function drawMetalPost(px, py) {
    // Post shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(px + 1, py + 1, postR + 1, 0, Math.PI * 2);
    ctx.fill();
    // Post body (cylindrical gradient)
    const postGrad = ctx.createLinearGradient(px - postR, py, px + postR, py);
    postGrad.addColorStop(0, '#3a3a3a');
    postGrad.addColorStop(0.3, '#6a6a6a');
    postGrad.addColorStop(0.5, '#888888');
    postGrad.addColorStop(0.7, '#6a6a6a');
    postGrad.addColorStop(1, '#3a3a3a');
    ctx.fillStyle = postGrad;
    ctx.beginPath();
    ctx.arc(px, py, postR, 0, Math.PI * 2);
    ctx.fill();
    // Post rim highlight
    ctx.strokeStyle = 'rgba(180,180,180,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, postR, 0, Math.PI * 2);
    ctx.stroke();
    // Post base plate
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(px - postR * 1.2, py + postR * 0.6, postR * 2.4, postR * 0.5);
  }

  drawMetalPost(boxLeft.x, boxLeft.y);
  drawMetalPost(boxRight.x, boxRight.y);

  // ── Gate arms with red/white stripes ──
  const armWidth = 4 * s;

  function drawStripedArm(x, yStart, yEnd, isLeft) {
    ctx.save();
    // Arm shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x - armWidth / 2 + 1, Math.min(yStart, yEnd) + 1, armWidth, Math.abs(yEnd - yStart));

    // Clip arm shape
    ctx.beginPath();
    ctx.roundRect(x - armWidth / 2, Math.min(yStart, yEnd), armWidth, Math.abs(yEnd - yStart), 2 * s);
    ctx.clip();

    // Red/white alternating stripes
    const stripeH = 6 * s;
    const yMin = Math.min(yStart, yEnd);
    const yMax = Math.max(yStart, yEnd);
    for (let sy = yMin; sy < yMax; sy += stripeH * 2) {
      ctx.fillStyle = '#d44040';
      ctx.fillRect(x - armWidth / 2, sy, armWidth, stripeH);
      ctx.fillStyle = '#e8e0d8';
      ctx.fillRect(x - armWidth / 2, sy + stripeH, armWidth, stripeH);
    }

    // Arm border
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.roundRect(x - armWidth / 2, yMin, armWidth, yMax - yMin, 2 * s);
    ctx.stroke();

    // Metallic highlight along one edge
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 0.5;
    const hlX = isLeft ? x + armWidth / 2 - 1 : x - armWidth / 2 + 1;
    ctx.beginPath();
    ctx.moveTo(hlX, yMin);
    ctx.lineTo(hlX, yMax);
    ctx.stroke();

    ctx.restore();
  }

  if (closed) {
    // Arms extend down to center (closed position)
    drawStripedArm(boxLeft.x, boxLeft.y, centerY + 2, true);
    drawStripedArm(boxRight.x, boxRight.y, centerY - 2, false);
  } else if (barrierValue !== undefined && barrierValue > 0.01 && barrierValue < 0.99) {
    // Smooth intermediate position during transition
    const t = 1 - barrierValue; // 0 = closed, 1 = open
    const partialLen = armLen * (1 - t * 0.85);
    drawStripedArm(boxLeft.x, boxLeft.y, boxLeft.y + partialLen * Math.sign(centerY - boxLeft.y), true);
    drawStripedArm(boxRight.x, boxRight.y, boxRight.y + partialLen * Math.sign(centerY - boxRight.y), false);
  } else if (now - flashTime < 0.5) {
    // Transitioning: arms partially raised
    const t = (now - flashTime) / 0.5;
    const partialLen = armLen * (1 - t * 0.7);
    drawStripedArm(boxLeft.x, boxLeft.y, boxLeft.y + partialLen * Math.sign(centerY - boxLeft.y), true);
    drawStripedArm(boxRight.x, boxRight.y, boxRight.y + partialLen * Math.sign(centerY - boxRight.y), false);
  }
  // When fully open, arms are not drawn (raised out of view)

  // ── Warning lights on posts (pulsing when closed) ──
  if (closed) {
    const lightPulse = Math.sin(now * 6) * 0.3 + 0.7;
    const lightR = postR * 0.35;

    function drawWarningLight(lx, ly) {
      // Light housing (small dark circle)
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(lx, ly, lightR * 1.4, 0, Math.PI * 2);
      ctx.fill();
      // Light glow (small red dot, minimal blur)
      ctx.fillStyle = `rgba(255,40,40,${lightPulse})`;
      ctx.shadowColor = '#ff2828';
      ctx.shadowBlur = 3 * s;
      ctx.beginPath();
      ctx.arc(lx, ly, lightR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Subtle outer glow ring
      ctx.strokeStyle = `rgba(255,40,40,${lightPulse * 0.15})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(lx, ly, lightR * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    drawWarningLight(boxLeft.x, boxLeft.y - postR * 2.8);
    drawWarningLight(boxRight.x, boxRight.y - postR * 2.8);
  }

  ctx.restore();
}

// ================================================================
//  Vehicle Vector Art (Clean flat shapes with outlines)
// ================================================================

// -- Car (top-down sedan, clean vector) --
function drawCar(ctx, x, y, s, facingRight, color, darkColor, lightColor) {
  const w = VEHICLE_SIZES.car.w * s;
  const h = VEHICLE_SIZES.car.h * s;

  ctx.save();
  ctx.translate(x, y);
  if (!facingRight) ctx.scale(-1, 1);

  // Shadow (simple, no blur)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(1, h * 0.15, w * 0.44, h * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wheels (simple black circles)
  const ww = w * 0.06, wh = h * 0.14;
  ctx.fillStyle = '#111';
  ctx.fillRect(w * 0.22, -h * 0.48, ww * 2, wh);
  ctx.fillRect(w * 0.22, h * 0.48 - wh, ww * 2, wh);
  ctx.fillRect(-w * 0.28, -h * 0.48, ww * 2, wh);
  ctx.fillRect(-w * 0.28, h * 0.48 - wh, ww * 2, wh);

  // Body (main rectangle with rounded ends)
  ctx.fillStyle = color;
  ctx.strokeStyle = '#0a0e0c';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h / 2, w, h, w * 0.12);
  ctx.fill();
  ctx.stroke();

  // Hood (front, lighter)
  ctx.fillStyle = lightColor;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.roundRect(w * 0.12, -h * 0.38, w * 0.34, h * 0.76, 2 * s);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Roof (center, slightly raised look)
  ctx.fillStyle = darkColor;
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.roundRect(-w * 0.18, -h * 0.35, w * 0.34, h * 0.7, 2 * s);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Windshield
  ctx.fillStyle = '#1a3028';
  ctx.strokeStyle = '#0a0e0c';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.roundRect(w * 0.10, -h * 0.36, w * 0.14, h * 0.72, 1.5 * s);
  ctx.fill();
  ctx.stroke();

  // Rear window
  ctx.fillStyle = '#1a3028';
  ctx.beginPath();
  ctx.roundRect(-w * 0.28, -h * 0.30, w * 0.10, h * 0.60, 1.5 * s);
  ctx.fill();
  ctx.stroke();

  // Headlights
  ctx.fillStyle = '#f0e8c0';
  ctx.beginPath();
  ctx.roundRect(w * 0.42, -h * 0.28, w * 0.06, h * 0.16, 1 * s);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(w * 0.42, h * 0.12, w * 0.06, h * 0.16, 1 * s);
  ctx.fill();

  // Tail lights
  ctx.fillStyle = '#d44040';
  ctx.beginPath();
  ctx.roundRect(-w * 0.48, -h * 0.28, w * 0.06, h * 0.16, 1 * s);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(-w * 0.48, h * 0.12, w * 0.06, h * 0.16, 1 * s);
  ctx.fill();

  ctx.restore();
}

// -- Bike (bold motorcycle silhouette, clearly distinct from car) --
function drawBike(ctx, x, y, s, facingRight, color, darkColor) {
  const w = VEHICLE_SIZES.bike.w * s;
  const h = VEHICLE_SIZES.bike.h * s;

  ctx.save();
  ctx.translate(x, y);
  if (!facingRight) ctx.scale(-1, 1);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(1, h * 0.15, w * 0.42, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rear wheel (black circle)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-w * 0.32, 0, h * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Front wheel (black circle)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(w * 0.32, 0, h * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Frame (thick dark bar connecting wheels)
  ctx.fillStyle = '#1a1a1a';
  ctx.strokeStyle = '#0a0e0c';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(-w * 0.28, -h * 0.18, w * 0.56, h * 0.36, 2 * s);
  ctx.fill();
  ctx.stroke();

  // Fuel tank (bright colored, prominent)
  ctx.fillStyle = color;
  ctx.strokeStyle = '#0a0e0c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-w * 0.06, -h * 0.35, w * 0.28, h * 0.70, 3 * s);
  ctx.fill();
  ctx.stroke();

  // Seat (dark, behind tank)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.roundRect(-w * 0.26, -h * 0.22, w * 0.22, h * 0.44, 2 * s);
  ctx.fill();

  // Handlebars (vertical bar at front)
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(w * 0.28, -h * 0.45);
  ctx.lineTo(w * 0.28, h * 0.45);
  ctx.stroke();

  // Rider body (simple oval, darker than frame)
  ctx.fillStyle = '#1e2a24';
  ctx.beginPath();
  ctx.ellipse(-w * 0.04, -h * 0.05, w * 0.12, h * 0.30, 0, 0, Math.PI * 2);
  ctx.fill();

  // Helmet (prominent circle on top)
  ctx.fillStyle = darkColor;
  ctx.strokeStyle = '#0a0e0c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(-w * 0.06, -h * 0.38, h * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Headlight (bright yellow dot at front)
  ctx.fillStyle = '#f0e8c0';
  ctx.shadowColor = '#f0e8c0';
  ctx.shadowBlur = 1 * s;
  ctx.beginPath();
  ctx.arc(w * 0.44, 0, 1 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Tail light (red dot at back)
  ctx.fillStyle = '#d44040';
  ctx.beginPath();
  ctx.arc(-w * 0.42, 0, 1.5 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// -- Auto-rickshaw (bold tuk-tuk silhouette, clearly distinct from car) --
function drawAuto(ctx, x, y, s, facingRight, color, darkColor) {
  const w = VEHICLE_SIZES.auto.w * s;

  ctx.save();

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();

  // Rear wheels (two circles, wider apart)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-w * 0.26, -h * 0.42, h * 0.14, 0, Math.PI * 2);

  ctx.arc(-w * 0.26, h * 0.42, h * 0.14, 0, Math.PI * 2);

  // Front hood (narrower, bright colored — the "nose" of the tuk-tuk)
  ctx.fillStyle = color;

  // Windshield (between cabin and hood)

  ctx.fillStyle = '#f0e8c0';

  ctx.fill();
  ctx.shadowBlur = 0;

  // Tail lights (red, at rear)

  ctx.arc(-w * 0.42, h * 0.18, 1.5 * s, 0, Math.PI * 2);
