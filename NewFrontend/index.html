// -- Main vehicle dispatch with disorder highlighting and boundary enforcement --
function drawVehicle(ctx, v, cw, ch, barrierClosed, trainActive, trainY, trainTotalLen) {
  const sizes = VEHICLE_SIZES[v.class] || VEHICLE_SIZES.car;
  // Scale lateral position with road width so vehicles stay centered in lanes
  const p = worldToCanvas(v.x, v.y * state.roadScale, cw, ch);
  const s = p.s * state.vehicleScale;

  const facingRight = v.side === 'left';
  const color = COLORS.vehicle[v.class] || COLORS.vehicle.car;
  const darkColor = COLORS.vehicleDark[v.class] || COLORS.vehicleDark.car;
  const lightColor = COLORS.vehicleLight[v.class] || COLORS.vehicleLight.car;

  const lat = Math.abs(v.lateral_offset || 0);
  const isOvertaking = lat > 0.3;
  const isWrongSide = lat > 0.58;

  // ---- Barrier boundary enforcement ----
  // When barrier is closed, vehicles must not be in the crossing box
  const halfBox = GEOMETRY.crossingBoxLength / 2; // 6
  const inCrossing = Math.abs(v.x) < halfBox;
  const barrierViolation = barrierClosed && inCrossing;

  // ---- Train boundary enforcement ----
  // Active train occupies x≈0, y range = [trainY - totalLen*direction, trainY]
  let trainViolation = false;
  if (trainActive) {
    const trainDir = state.train.direction;
    const trainTop = trainDir > 0 ? trainY : trainY - trainTotalLen;
    const trainBot = trainDir > 0 ? trainY - trainTotalLen : trainY;
    const trainBoxTop = Math.max(trainTop, trainBot);
    const trainBoxBot = Math.min(trainTop, trainBot);
    // Vehicle overlaps with train bounding box (x near 0, y within train range)
    const xNearTrain = Math.abs(v.x) < sizes.w * 0.6;
    const yInTrain = v.y < trainBoxTop + 2 && v.y > trainBoxBot - 2;
    trainViolation = xNearTrain && yInTrain;
  }

  // Draw the vehicle sprite (always draw it, even if in violation)
  switch (v.class) {
    case 'bike':
      drawBike(ctx, p.x, p.y, s, facingRight, color, darkColor);
      break;
    case 'auto':
      drawAuto(ctx, p.x, p.y, s, facingRight, color, darkColor);
      break;
    default:
      drawCar(ctx, p.x, p.y, s, facingRight, color, darkColor, lightColor);
      break;
  }

  // Boundary violation - bold red pulsing border
  const now = performance.now() / 1000;
  const violation = barrierViolation || trainViolation;
  if (violation) {
    const halfW = (sizes.w * s) / 2;
    const halfH = (sizes.h * s) / 2;
    const pulse = Math.sin(now * 10) * 0.4 + 0.6;
    ctx.strokeStyle = `rgba(255,20,20,${pulse})`;
    ctx.lineWidth = Math.max(2, 3 * s);
    ctx.setLineDash([4 * s, 3 * s]);
    ctx.beginPath();
    ctx.roundRect(p.x - halfW - 3, p.y - halfH - 3, halfW * 2 + 6, halfH * 2 + 6, 3 * s);
    ctx.stroke();
    ctx.setLineDash([]);
    // Red fill overlay
    ctx.fillStyle = `rgba(255,0,0,${0.08 * pulse})`;
    ctx.beginPath();
    ctx.roundRect(p.x - halfW - 2, p.y - halfH - 2, halfW * 2 + 4, halfH * 2 + 4, 2 * s);
    ctx.fill();
  }

  // Wrong-side red outline (clean, no shadow)
  if (isWrongSide && !violation) {
    const halfW = (sizes.w * s) / 2;
    const halfH = (sizes.h * s) / 2;
    ctx.strokeStyle = '#ff4040';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(p.x - halfW - 2, p.y - halfH - 2, halfW * 2 + 4, halfH * 2 + 4, 3 * s);
    ctx.stroke();
  }

  // Overtaking dot indicator
  if (isOvertaking && !isWrongSide && !violation) {
    const dotX = p.x + (sizes.w * s) / 2 + 4 * s;
    const dotY = p.y - (sizes.h * s) / 2;
    ctx.fillStyle = '#ff8c3c';
    ctx.beginPath();
    ctx.arc(dotX, dotY, 2 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // Debug: vehicle ID, speed, and lateral offset
  if (state.showDebug) {
    const halfW = (sizes.w * s) / 2;
    const halfH = (sizes.h * s) / 2;
    ctx.fillStyle = 'rgba(200,212,204,0.5)';
    ctx.font = `500 ${Math.max(6, 7 * s)}px 'SF Mono', 'Consolas', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`${v.id}`, p.x, p.y - halfH - 4 * s);
    ctx.fillText(`${v.speed.toFixed(1)}`, p.x, p.y + halfH + 8 * s);
    if (lat > 0.1) {
      ctx.fillStyle = isWrongSide ? '#ff4040' : '#ff8c3c';
      ctx.fillText(`lat:${v.lateral_offset.toFixed(2)}`, p.x, p.y + halfH + 16 * s);
    }
  }
}

// ================================================================
//  Effects
// ================================================================
function drawConflictFlash(ctx, cw, ch, flashTime, now) {
  if (now - flashTime > 0.4) return;
  const alpha = 1.0 - (now - flashTime) / 0.4;
  const p = worldToCanvas(0, 0, cw, ch);
  const s = p.s;

  ctx.save();
  ctx.globalAlpha = alpha * 0.3;
  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 25 * s);
  grad.addColorStop(0, '#d45555');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 25 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ================================================================
//  Train System (visual overlay — continuous freight)
// ================================================================
// The train feeds new freight cars at a fixed entry point just off-screen.
// Cars emerge at the rate of speed/carLength per sec, keeping the tail
// stationary while the front moves forward. The train can grow to 30+ cars
// but only 2-3 are on-screen at any time — the rest are culled.
// The last car clears the crossing ~1 second before the barrier opens.
// ================================================================
function drawTrain(ctx, cw, ch, train) {
  if (!train.active) return;
  const s = worldToCanvas(0, 0, cw, ch).s;
  const trackX = worldToCanvas(0, 0, cw, ch).x;
  const screenYMax = GEOMETRY.canvasYMax;
  const screenYMin = GEOMETRY.canvasYMin;

  ctx.save();
  try {
    const carW = 10 * s;
    const engineW = 11 * s;

    // Iterate through each car, compute its world Y range, draw if on-screen
    for (let i = 0; i < train.numCars; i++) {
      const isEngine = (i === 0);
      const len = isEngine ? train.engineLength : train.carLength;
      const w = isEngine ? engineW : carW;

      // Car front (leading edge) and back (trailing edge) in world Y
      // Engine is at the very front, cars trail behind
      let carFront, carBack;
      if (train.direction > 0) {
        // Moving south-to-north: front is at train.y, cars trail toward -Y
        carFront = train.y - (isEngine ? 0 : train.engineLength + (i - 1) * train.carLength);
        carBack = carFront - len;
      } else {
        // Moving north-to-south: front is at train.y, cars trail toward +Y
        carFront = train.y + (isEngine ? 0 : train.engineLength + (i - 1) * train.carLength);
        carBack = carFront + len;
      }

      // Skip cars entirely off-screen (with margin for glow/shadow)
      const carMaxWorldY = Math.max(carFront, carBack);
      const carMinWorldY = Math.min(carFront, carBack);
      if (carMaxWorldY < screenYMin - 5 || carMinWorldY > screenYMax + 5) continue;

      // Convert to canvas Y
      const carTop = worldToCanvas(0, carMaxWorldY, cw, ch).y;
      const carBot = worldToCanvas(0, carMinWorldY, cw, ch).y;
      const carHpx = Math.max(1, carBot - carTop);

      // --- Car shadow ---
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(trackX - w / 2 + 2, carTop + 2, w, carHpx);

      // --- Car body ---
      if (isEngine) {
        const engineGrad = ctx.createLinearGradient(trackX - w / 2, carTop, trackX + w / 2, carTop);
        engineGrad.addColorStop(0, COLORS.trainBodyLight);
        engineGrad.addColorStop(0.3, COLORS.trainBody);
        engineGrad.addColorStop(0.7, COLORS.trainBodyDark);
        engineGrad.addColorStop(1, COLORS.trainBodyDark);
        ctx.fillStyle = engineGrad;
      } else {
        // Alternate freight car colors for variety
        const carColors = [
          ['#1e3850', '#162a42', '#0e1e30'],  // dark blue
          ['#3a2a1a', '#2e2015', '#1e1510'],  // brown freight
          ['#2a3a2a', '#1e2e1e', '#142214'],  // dark green
          ['#3a2020', '#2e1818', '#201010'],  // dark red
        ];
        const palette = carColors[i % carColors.length];
        const carGrad = ctx.createLinearGradient(trackX - w / 2, carTop, trackX + w / 2, carTop);
        carGrad.addColorStop(0, palette[0]);
        carGrad.addColorStop(0.5, palette[1]);
        carGrad.addColorStop(1, palette[2]);
        ctx.fillStyle = carGrad;
      }
      ctx.beginPath();
      ctx.roundRect(trackX - w / 2, carTop, w, carHpx, 3 * s);
      ctx.fill();

      // --- Car border ---
      ctx.strokeStyle = 'rgba(100,140,170,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(trackX - w / 2, carTop, w, carHpx, 3 * s);
      ctx.stroke();

      // --- Stripe along the side ---
      if (isEngine) {
        ctx.fillStyle = COLORS.trainStripe;
      } else {
        ctx.fillStyle = 'rgba(200,180,100,0.15)';
      }
      const stripeW = 2 * s;
      ctx.fillRect(trackX - w / 2 + w * 0.3, carTop + 2 * s, stripeW, Math.max(1, carHpx - 4 * s));

      // --- Freight car details (only if tall enough to see) ---
      if (!isEngine && carHpx > 8) {
        // Cargo container ridges
        ctx.strokeStyle = 'rgba(80,100,120,0.25)';
        ctx.lineWidth = 0.8;
        const ridgeCount = Math.max(2, Math.floor(carHpx / (6 * s)));
        for (let r = 1; r < ridgeCount; r++) {
          const ry = carTop + (carHpx * r / ridgeCount);
          ctx.beginPath();
          ctx.moveTo(trackX - w * 0.35, ry);
          ctx.lineTo(trackX + w * 0.35, ry);
          ctx.stroke();
        }
        // Container end-lines
        ctx.strokeStyle = 'rgba(120,140,160,0.2)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(trackX - w / 2 + 1, carTop + 2 * s);
        ctx.lineTo(trackX - w / 2 + 1, carBot - 2 * s);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(trackX + w / 2 - 1, carTop + 2 * s);
        ctx.lineTo(trackX + w / 2 - 1, carBot - 2 * s);
        ctx.stroke();
      }

      // --- Engine headlight ---
      if (isEngine) {
        const hlY = train.direction > 0 ? carTop - 2 * s : carBot + 2 * s;
        ctx.fillStyle = '#f0e8c0';
        ctx.shadowColor = '#f0e8c0';
        ctx.shadowBlur = 2 * s;
        ctx.beginPath();
        ctx.arc(trackX - w * 0.25, hlY, 1.5 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(trackX + w * 0.25, hlY, 1.5 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Exhaust stack
        ctx.fillStyle = '#333';
        const exY = train.direction > 0 ? carBot - carHpx * 0.2 : carTop + carHpx * 0.2;
        ctx.beginPath();
        ctx.arc(trackX, exY, 2 * s, 0, Math.PI * 2);
        ctx.fill();
        // Smoke puff
        ctx.fillStyle = 'rgba(120,120,120,0.12)';
        ctx.beginPath();
        ctx.arc(trackX + 4 * s, exY, 3 * s, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- Coupling between cars ---
      if (i < train.numCars - 1) {
        ctx.fillStyle = '#555';
        const coupY = train.direction > 0 ? carBot + 1 * s : carTop - 1 * s;
        // Only draw if visible
        if (coupY > carTop - 4 * s && coupY < carBot + 4 * s) {
          ctx.fillRect(trackX - 1 * s, coupY - 1 * s, 2 * s, 2 * s);
        }
      }
    }

    // Vibration lines when train is on-screen
    ctx.strokeStyle = 'rgba(200,200,200,0.05)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 3; i++) {
      const vy = worldToCanvas(0, screenYMin + Math.random() * (screenYMax - screenYMin), cw, ch).y;
      const vx = trackX + (Math.random() - 0.5) * carW * 1.5;
      ctx.beginPath();
      ctx.moveTo(vx, vy - 3 * s);
      ctx.lineTo(vx, vy + 3 * s);
      ctx.stroke();
    }
  } finally {
    ctx.restore();
  }
}

function updateTrain(dt) {
  const t = state.train;
  if (!t.active) return;

  // Track elapsed time since train started
  t.elapsedTime += dt;

  // Move front forward
  t.y += t.direction * t.speed * dt;

  // Generate new freight cars at the tail (entry point)
  // Cars emerge from t.entryY at a steady rate = carLength / speed
  // This keeps the tail at the fixed entry point while the front moves away
  if (!t.generationDone) {
    t.genTimer += dt;
    while (t.genTimer >= t.genInterval) {
      t.numCars++;
      t.genTimer -= t.genInterval;
    }
    // Stop generating at the calculated time
    // The last generated car will clear the crossing ~1s before barrier opens
    if (t.elapsedTime >= t.stopGenTime) {
      t.generationDone = true;
    }
  }

  // Check if the entire train has exited the visible area
  // The tail must pass the far edge of the screen
  const viewExit = GEOMETRY.canvasYMax + 20;
  if (t.direction > 0) {
    // Tail = front - totalLength (moving south-to-north)
    // Done when tail is past the north edge
    if (t.y - t.totalLength > viewExit) {
      t.active = false;
    }
  } else {
    // Tail = front + totalLength (moving north-to-south)
    if (t.y + t.totalLength < -viewExit) {
      t.active = false;
    }
  }
}

// ================================================================
//  Collision Detection & Crash SFX
// ================================================================

// Max overlapping area ratio to consider a "real" collision (vehicles brushing by)
const COLLISION_OVERLAP_THRESHOLD = 0.65;

function detectVehicleCollisions(f, now) {
  const vehicles = f.vehicles;
  const newCollisions = [];

  for (let i = 0; i < vehicles.length; i++) {
    for (let j = i + 1; j < vehicles.length; j++) {
      const a = vehicles[i];
      const b = vehicles[j];

      // Only vehicles from different lanes (opposite direction) can collide
      if (a.side === b.side) continue;

      // Only crash if at least one vehicle is on the wrong side (lat > 0.58 = red outline)
      // Overtaking (0.3-0.58) and normal vehicles use queue/lane-change boundary logic instead
      const aWrongSide = Math.abs(a.lateral_offset || 0) > 0.58;
      const bWrongSide = Math.abs(b.lateral_offset || 0) > 0.58;
      if (!aWrongSide && !bWrongSide) continue;

      // Use the same VEHICLE_SIZES as the drawing code
      const aSize = VEHICLE_SIZES[a.class] || VEHICLE_SIZES.car;
      const bSize = VEHICLE_SIZES[b.class] || VEHICLE_SIZES.car;

      // Check overlap in both road-aligned (X) and lateral (Y) dimensions
      const xOverlap = Math.abs(a.x - b.x) < (aSize.w + bSize.w) / 2 * COLLISION_OVERLAP_THRESHOLD;
      const yOverlap = Math.abs(a.y - b.y) < (aSize.h + bSize.h) / 2 * COLLISION_OVERLAP_THRESHOLD;

      if (xOverlap && yOverlap) {
        const collId = `${Math.min(a.id||i, b.id||j)}-${Math.max(a.id||i, b.id||j)}`;
        newCollisions.push({
          x: (a.x + b.x) / 2,
          y: (a.y + b.y) / 2,
          time: now,
          word: '\uD83D\uDCA5', // boom emoji
          id: collId,
        });
      }
    }
  }
  return newCollisions;
}

function drawCollisionEffects(ctx, cw, ch) {
  const now = performance.now() / 1000;
  const colls = state.collisions;

  // Remove expired collisions
  for (let i = colls.length - 1; i >= 0; i--) {
    if (now - colls[i].time > 1.0) {
      colls.splice(i, 1);
    }
  }

  for (const c of colls) {
    const age = now - c.time;
    const alpha = Math.min(1, 1 - age * 0.8);
    const p = worldToCanvas(c.x, c.y * state.roadScale, cw, ch);
    const s = p.s;

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(age * 12) * 0.08);

    // --- Tiny flash glow ---
    ctx.fillStyle = 'rgba(255,240,180,0.12)';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 2 * s;
    ctx.beginPath();
    ctx.arc(0, 0, 3 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // --- Tiny bang burst (no growth) ---
    ctx.fillStyle = '#ffdd44';
    ctx.strokeStyle = '#cc4400';
    ctx.lineWidth = Math.max(0.6, 0.6 * s);
    const spikes = 4;
    const outerR = 2 * s;
    const innerR = 0.8 * s;
    ctx.beginPath();
    for (let k = 0; k < spikes * 2; k++) {
      const angle = (k / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      const r = k % 2 === 0 ? outerR : innerR;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (k === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // --- Boom Emoji (no growth, just fade) ---
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.font = `${Math.max(4, 3 * s)}px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.word, 0, 0);

    ctx.restore();
  }
}

// Check for collisions and merge into state list (runs once per frame)
function updateCollisions(f, now) {
  // Find new collisions
  const fresh = detectVehicleCollisions(f, now);
  const existingIds = new Set(state.collisions.map(c => c.id));

  for (const nc of fresh) {
    // Only add if not already active (prevents repeated triggers each frame)
    if (!existingIds.has(nc.id)) {
      state.collisions.push(nc);
    }
  }
}

// ================================================================
//  Main Render Loop
// ================================================================
function render() {
  if (!canvases.length) return;

  // Use interpolated frame during playback, discrete frame when paused
  const frame = state.playing
    ? getInterpolatedFrame(state.data, state.fractionalFrame)
    : getCurrentFrame();
  const frame2 = state.compareMode
    ? (state.playing
      ? getInterpolatedFrame(state.data2, state.fractionalFrame)
      : getFrame(state.data2, state.frameIndex))
    : null;

  const panels = [frame];
  if (frame2) panels.push(frame2);

  for (let i = 0; i < canvases.length && i < panels.length; i++) {
    const { canvas, ctx, label } = canvases[i];
    const f = panels[i];
    const w = canvases[i].w;
    const h = canvases[i].h;

    if (!f) continue;

    // Clear
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, w, h);

    // Road
    drawRoad(ctx, w, h);

    // Conflict flash
    if (f.metrics && f.metrics.conflict_count > 0) {
      const prevFrame = getFrame(state.data, Math.max(0, state.frameIndex - 1));
      if (prevFrame && f.metrics.conflict_count > (prevFrame.metrics?.conflict_count || 0)) {
        state.conflictFlashTime = performance.now() / 1000;
      }
    }
    drawConflictFlash(ctx, w, h, state.conflictFlashTime, performance.now() / 1000);

    // Barrier
    const barrierClosed = f.barrier_closed;
    const barrierValue = f.barrier_value; // 0..1 for smooth interpolation
    drawBarrier(ctx, w, h, barrierClosed, state.decisionFlashTime, performance.now() / 1000, barrierValue);

    // Train (visual overlay, only on main panel)
    if (i === 0) {
      const now = performance.now() / 1000;
      const dt = state.lastRenderTime ? Math.min(now - state.lastRenderTime, 0.1) : 1 / 60;
      state.lastRenderTime = now;

      const t = state.train;

      // Spawn train when barrier closes
      if (f.barrier_closed && !t.active) {
        t.direction = 1; // always south-to-north for consistency
        t.speed = 20;
        t.genInterval = t.carLength / t.speed; // 0.4s per car
        t.numCars = 1;     // start with engine only
        t.genTimer = 0;
        t.elapsedTime = 0;
        t.generationDone = false;
        t.active = true;

        // Entry point: just off-screen south (for direction=1)
        const entryMargin = 15;
        t.entryY = -(GEOMETRY.canvasYMax + entryMargin); // -25

        // Initial position: tail at entry point (cars emerge from there)
        t.y = t.entryY + t.engineLength; // -13 (front just south of visible area)

        // Find when barrier will next open by scanning frame data
        const data = state.data;
        const currentIdx = state.frameIndex;
        let openIdx = currentIdx + 1;
        while (openIdx < data.frames.length && data.frames[openIdx].barrier_closed) {
          openIdx++;
        }
        const barrierSecs = (openIdx - currentIdx) / 2; // fps=2

        // Time for last car to travel from entry point to crossing exit
        const crossingExit = GEOMETRY.roadHalfWidth * state.roadScale; // ~4.2
        const lastCarDist = Math.abs(t.entryY) + crossingExit; // 29.2
        const lastCarTime = lastCarDist / t.speed; // ~1.46s

        // Stop generating so last car clears ~1 second before barrier opens
        t.stopGenTime = Math.max(0, barrierSecs - 1 - lastCarTime);
      }

      // When barrier opens while train is still crossing:
      // Continue drawing the train until its tail exits naturally (handled in updateTrain)
      // This prevents the train from vanishing mid-crossing

      // Advance the train regardless of play/pause
      if (t.active) {
        updateTrain(dt);
      }
    }
    if (state.train.active) {
      drawTrain(ctx, w, h, state.train);
    }

    // Disorder zone pulse when disorder is high
    if (f.metrics && f.metrics.disorder_index > 0.15) {
      const disorder = f.metrics.disorder_index;
      const now = performance.now() / 1000;
      const pulse = Math.sin(now * 3) * 0.5 + 0.5;
      const alpha = disorder * 0.08 * (0.6 + pulse * 0.4);
      const rhw = GEOMETRY.roadHalfWidth * state.roadScale;
      const dzLeft = worldToCanvas(-GEOMETRY.approachLength, rhw, w, h);
      const dzLeftEnd = worldToCanvas(-GEOMETRY.approachLength + GEOMETRY.disorderZoneLength, -rhw, w, h);
      const dzRight = worldToCanvas(GEOMETRY.approachLength + GEOMETRY.crossingBoxLength, rhw, w, h);
      const dzRightEnd = worldToCanvas(GEOMETRY.approachLength + GEOMETRY.crossingBoxLength - GEOMETRY.disorderZoneLength, -rhw, w, h);

      ctx.fillStyle = `rgba(255,100,50,${alpha})`;
      ctx.fillRect(dzLeft.x, dzLeft.y, dzLeftEnd.x - dzLeft.x, dzLeftEnd.y - dzLeft.y);
      ctx.fillRect(dzRight.x, dzRight.y, dzRightEnd.x - dzRight.x, dzRightEnd.y - dzRight.y);
    }

    // Vehicles (sorted by y for proper overlap)
    const sorted = [...f.vehicles].sort((a, b) => a.y - b.y);
    const trainActive = state.train.active;
    const trainY = state.train.y;
    const trainTotalLen = state.train.totalLength;
    for (const v of sorted) {
      drawVehicle(ctx, v, w, h, barrierClosed, trainActive, trainY, trainTotalLen);
    }

    // Collision effects (drawn on main panel only)
    if (i === 0) {
      updateCollisions(f, performance.now() / 1000);
      drawCollisionEffects(ctx, w, h);
    }

    // Debug overlay
    if (state.showDebug && f.metrics) {
      ctx.fillStyle = 'rgba(12,15,13,0.92)';
      ctx.strokeStyle = 'rgba(201,168,76,0.12)';
      ctx.lineWidth = 1;
      const panelW = 195;
      const panelH = 105;
      ctx.beginPath();
      ctx.roundRect(4, 4, panelW, panelH, 3);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#6a8a72';
      ctx.font = '500 9px "SF Mono", "Consolas", monospace';
      ctx.textAlign = 'left';
      const lines = [
        `L Queue: ${f.metrics.queue_left} (${f.metrics.queue_length_left}m)`,
        `R Queue: ${f.metrics.queue_right} (${f.metrics.queue_length_right}m)`,
        `Disorder: ${f.metrics.disorder_index}`,
        `Wrong Side: ${f.metrics.wrong_side_queue_share}`,
        `Risk: ${f.metrics.occupancy_risk}`,
        `Conflicts: ${f.metrics.conflict_count}`,
      ];
      lines.forEach((line, j) => {
        ctx.fillText(line, 10, 18 + j * 14);
      });
    }

    // Update label
    label.textContent = i === 0 ? (state.data?.policy || '\u2014') : (state.data2?.policy || '\u2014');

    // Update HUD
    updateHUD(f, i);
  }
}

function updateHUD(frame, panelIndex) {
  const panel = canvases[panelIndex]?.panel;
  if (!panel) return;

  const timeEl = panel.querySelector('.time');
  const barrierEl = panel.querySelector('.barrier-open, .barrier-closed');

  if (timeEl) timeEl.textContent = `${frame.time.toFixed(1)}s`;
  if (barrierEl) {
    barrierEl.className = frame.barrier_closed ? 'barrier-closed' : 'barrier-open';
    barrierEl.textContent = frame.barrier_closed ? '\u25cf Barrier Closed' : '\u25cf Barrier Open';
  }

  const m = frame.metrics || {};
  const setHud = (key, val) => {
    const el = panel.querySelector(`[data-hud="${key}"]`);
    if (el) el.textContent = val;
  };
  setHud('queueLeft', m.queue_left ?? '\u2014');
  setHud('queueRight', m.queue_right ?? '\u2014');

  // Disorder bar indicator
  const disorderBar = panel.querySelector('[data-hud="disorderBar"]');
  if (disorderBar) {
    const disorderVal = m.disorder_index ?? 0;
    const fill = disorderBar.querySelector('.disorder-fill');
    const text = disorderBar.querySelector('.disorder-text');
    if (fill) fill.style.width = `${Math.min(100, disorderVal * 200)}%`;
    if (text) {
      text.textContent = `Disorder: ${disorderVal.toFixed(3)}`;
      text.className = 'disorder-text' + (disorderVal > 0.4 ? ' critical' : disorderVal > 0.15 ? ' high' : '');
    }
  }

  // Wrong side queue share
  const wrongSideVal = m.wrong_side_queue_share ?? 0;
  const wrongSideEl = panel.querySelector('[data-hud="wrongSide"]');
  if (wrongSideEl) {
    wrongSideEl.textContent = wrongSideVal.toFixed(3);
    wrongSideEl.className = wrongSideVal > 0.3 ? 'metric-val risk-high' : 'metric-val';
  }

  const riskEl = panel.querySelector('[data-hud="risk"]');
  if (riskEl) {
    riskEl.textContent = (m.occupancy_risk ?? 0).toFixed(3);
    riskEl.className = (m.occupancy_risk ?? 0) > 0.7 ? 'metric-val risk-high' : 'metric-val';
  }
  if (state.showDebug) {
    setHud('debugInfo', `${frame.vehicles?.length || 0} vehicles`);
    const debugEl = panel.querySelector('[data-hud="debug"]');
    if (debugEl) debugEl.style.display = '';
  } else {
    const debugEl = panel.querySelector('[data-hud="debug"]');
    if (debugEl) debugEl.style.display = 'none';
  }
}

// ================================================================
//  Data Access
// ================================================================
function getCurrentFrame() {
  return getFrame(state.data, state.frameIndex);
}

function getFrame(data, index) {
  if (!data || !data.frames || !data.frames.length) return null;
  const i = Math.max(0, Math.min(index, data.frames.length - 1));
  return data.frames[i];
}

// Interpolate between two frames for smooth playback
function getInterpolatedFrame(data, fractionalIndex) {
  if (!data || !data.frames || data.frames.length < 2) return getFrame(data, Math.round(fractionalIndex));
  const maxIdx = data.frames.length - 1;
  const idx = Math.max(0, Math.min(fractionalIndex, maxIdx));
  const i0 = Math.floor(idx);
  const i1 = Math.min(i0 + 1, maxIdx);
  const t = idx - i0; // interpolation factor 0..1
  if (t < 0.001) return data.frames[i0]; // snap to frame when very close

  const f0 = data.frames[i0];
  const f1 = data.frames[i1];

  // Interpolate vehicles by matching IDs
  const interpVehicles = [];
  const v1Map = {};
  for (const v of f1.vehicles || []) v1Map[v.id] = v;

  for (const v0 of f0.vehicles || []) {
    const v1 = v1Map[v0.id];
    if (v1) {
      interpVehicles.push({
        ...v0,
        x: v0.x + (v1.x - v0.x) * t,
        y: v0.y + (v1.y - v0.y) * t,
        lateral_offset: (v0.lateral_offset || 0) + ((v1.lateral_offset || 0) - (v0.lateral_offset || 0)) * t,
        speed: v0.speed + (v1.speed - v0.speed) * t,
      });
    } else {
      interpVehicles.push(v0);
    }
  }

  // Interpolate scalar metrics
  const m0 = f0.metrics || {};
  const m1 = f1.metrics || {};
  const interpMetrics = {};
  for (const key of Object.keys(m0)) {
    if (typeof m0[key] === 'number' && typeof m1[key] === 'number') {
      interpMetrics[key] = m0[key] + (m1[key] - m0[key]) * t;
    } else {
      interpMetrics[key] = t < 0.5 ? m0[key] : m1[key];
    }
  }

  // Interpolate barrier state (smooth transition)
  const barrier0 = f0.barrier_closed ? 1 : 0;
  const barrier1 = f1.barrier_closed ? 1 : 0;
  const barrierInterp = barrier0 + (barrier1 - barrier0) * t;

  return {
    time: f0.time + (f1.time - f0.time) * t,
    barrier_closed: barrierInterp > 0.5,
    barrier_value: barrierInterp, // for smooth animation
    vehicles: interpVehicles,
    metrics: interpMetrics,
  };
}

function getTotalFrames() {
  return state.data?.frames?.length || 0;
}

function getMaxTime() {
  const f = state.data?.frames;
  return f && f.length ? f[f.length - 1].time : 0;
}

// ================================================================
//  Playback
// ================================================================
function startPlayback() {
  if (state.playing) return;
  state.playing = true;
  state.fractionalFrame = state.frameIndex; // sync from current position
  btnPlay.textContent = '\u23f8';
  lastTick = performance.now();
  tick();
}

function stopPlayback() {
  state.playing = false;
  btnPlay.textContent = '\u25b6';
  if (animFrame) cancelAnimationFrame(animFrame);
}

function tick() {
  if (!state.playing) return;
  const now = performance.now();
  const dt = (now - lastTick) / 1000; // seconds since last tick
  lastTick = now;

  // Advance fractional frame based on speed
  // Base rate: 2 frames per second (500ms per frame)
  const framesPerSecond = 2 * state.speed;
  state.fractionalFrame += dt * framesPerSecond;

  const maxFrames = getTotalFrames();
  if (state.fractionalFrame >= maxFrames - 1) {
    state.fractionalFrame = maxFrames - 1;
    state.frameIndex = maxFrames - 1;
    stopPlayback();
    render();
    updateScrubber();
    return;
  }

  // Sync integer frame index for scrubber display
  state.frameIndex = Math.floor(state.fractionalFrame);

  render();
  updateScrubber();
  animFrame = requestAnimationFrame(tick);
}

function updateScrubber() {
  const maxFrames = getTotalFrames();
  if (!maxFrames) return;
  scrubber.max = maxFrames - 1;
  scrubber.value = state.frameIndex;
  const frame = state.playing
    ? getInterpolatedFrame(state.data, state.fractionalFrame)
    : getCurrentFrame();
  const maxTime = getMaxTime();
  timeDisplay.textContent = `${(frame?.time || 0).toFixed(1)}s / ${maxTime.toFixed(1)}s`;
}

function seekToFrame(index) {
  state.frameIndex = Math.max(0, Math.min(index, getTotalFrames() - 1));
  state.fractionalFrame = state.frameIndex;
  render();
  updateScrubber();
}

// ================================================================
//  Data Loading
// ================================================================
async function loadIndex() {
  try {
    const resp = await fetch('data/index.json');
    if (!resp.ok) return;
    state.scenarios = (await resp.json()).scenarios || {};
    populateScenarioSelect();
  } catch {
    // fetch failed (likely file:// protocol) — hint via empty state
    emptyState.querySelector('p').innerHTML =
      'Use <strong>Load Files</strong> below to open exported JSON files, ' +
      'or drag them onto this area.<br><br>' +
      'To use the dropdowns automatically, serve via:<br>' +
      '<code>python -m http.server 8000 -d docs/visualizer</code>';
  }
}

function populateScenarioSelect() {
  scenarioSelect.innerHTML = '<option value="">Select scenario...</option>';
  for (const scenario of Object.keys(state.scenarios).sort()) {
    const opt = document.createElement('option');
    opt.value = scenario;
    opt.textContent = scenario.replace(/_/g, ' ');
    scenarioSelect.appendChild(opt);
  }
}

function populatePolicySelect(policies) {
  policySelect.innerHTML = '<option value="">Select policy...</option>';
  policySelect2.innerHTML = '<option value="">Compare with...</option>';
  for (const p of policies) {
    const opt1 = document.createElement('option');
    opt1.value = p;
    opt1.textContent = p.replace(/_/g, ' ');
    policySelect.appendChild(opt1);

    const opt2 = opt1.cloneNode(true);
    policySelect2.appendChild(opt2);
  }
}

async function loadPolicyData(scenario, policy) {
  // Check in-memory cache first (from file input)
  if (state.fileData) {
    const cached = state.fileData[`${scenario}\t${policy}`];
    if (cached) return cached;
  }
  const filename = `${scenario}_${policy.replace(/\s+/g, '_').toLowerCase()}.json`;
  try {
    const resp = await fetch(`data/${filename}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch {
    try {
      const resp2 = await fetch(`data/${scenario}/${filename}`);
      if (!resp2.ok) throw new Error(`HTTP ${resp2.status}`);
      return await resp2.json();
    } catch {
      return null;
    }
  }
}

// ================================================================
//  Speed Slider
// ================================================================
const SPEED_STEPS = [0.025, 0.05, 0.1, 0.25, 0.5, 1, 2, 5];

function updateSpeedFromSlider() {
  const idx = parseInt(speedSlider.value, 10);
  state.speed = SPEED_STEPS[idx];
  speedLabel.textContent = state.speed + 'x';
}

// ================================================================
//  Event Handlers
// ================================================================
btnPlay.addEventListener('click', () => {
  state.playing ? stopPlayback() : startPlayback();
});

speedSlider.addEventListener('input', updateSpeedFromSlider);

// Road size slider (visual only, does not affect simulation)
roadSizeSlider.addEventListener('input', () => {
  const val = parseInt(roadSizeSlider.value, 10);
  state.roadScale = val / 10;
  roadSizeLabel.textContent = state.roadScale.toFixed(1) + 'x';
  render();
});

// Vehicle size slider
vehicleSizeSlider.addEventListener('input', () => {
  const val = parseInt(vehicleSizeSlider.value, 10);
  state.vehicleScale = val / 10;
  vehicleSizeLabel.textContent = state.vehicleScale.toFixed(1) + 'x';
  render();
});

$('#btnStepBack').addEventListener('click', () => {
  stopPlayback();
  const idx = Math.max(0, state.frameIndex - 1);
  state.frameIndex = idx;
  state.fractionalFrame = idx;
  render();
  updateScrubber();
});

$('#btnStepFwd').addEventListener('click', () => {
  stopPlayback();
  const idx = Math.min(getTotalFrames() - 1, state.frameIndex + 1);
  state.frameIndex = idx;
  state.fractionalFrame = idx;
  render();
  updateScrubber();
});

scrubber.addEventListener('input', () => {
  stopPlayback();
  const idx = parseInt(scrubber.value, 10);
  state.frameIndex = idx;
  state.fractionalFrame = idx;
  render();
  updateScrubber();
});

debugToggle.addEventListener('change', () => {
  state.showDebug = debugToggle.checked;
  render();
});

scenarioSelect.addEventListener('change', async () => {
  const scenario = scenarioSelect.value;
  if (!scenario) return;
  stopPlayback();
  state.data = null;
  state.data2 = null;
  state.frameIndex = 0;

  const policies = state.scenarios[scenario] || [];
  populatePolicySelect(policies);

  if (policies.length > 0) {
    policySelect.value = policies[0];
    await loadAndRender(scenario, policies[0]);
  }
});

policySelect.addEventListener('change', async () => {
  const scenario = scenarioSelect.value;
  const policy = policySelect.value;
  if (!scenario || !policy) return;
  stopPlayback();
  state.frameIndex = 0;
  await loadAndRender(scenario, policy);
});

policySelect2.addEventListener('change', async () => {
  if (!state.compareMode) return;
  const scenario = scenarioSelect.value;
  const policy = policySelect2.value;
  if (!scenario || !policy) {
    state.data2 = null;
    createCanvasPanels(1);
    render();
    return;
  }
  state.data2 = await loadPolicyData(scenario, policy);
  if (state.data2 && canvases.length < 2) {
    createCanvasPanels(2);
  }
  render();
});

btnCompare.addEventListener('click', () => {
  state.compareMode = !state.compareMode;
  btnCompare.classList.toggle('active', state.compareMode);
  policySelect2.style.display = state.compareMode ? '' : 'none';

  if (state.compareMode) {
    createCanvasPanels(2);
    if (policySelect2.value) {
      policySelect2.dispatchEvent(new Event('change'));
    }
  } else {
    state.data2 = null;
    createCanvasPanels(1);
    render();
  }
});

async function loadAndRender(scenario, policy) {
  const data = await loadPolicyData(scenario, policy);
  if (!data) {
    emptyState.style.display = '';
    emptyState.querySelector('h2').textContent = 'Data file not found';
    emptyState.querySelector('p').textContent = `Could not load data/${scenario}_${policy.replace(/\s+/g, '_').toLowerCase()}.json`;
    return;
  }
  state.data = data;
  state.frameIndex = 0;
  state.fractionalFrame = 0;
  state.train.active = false;
  state.train.numCars = 1;
  state.train.generationDone = false;
  state.train.elapsedTime = 0;
  state.train.genTimer = 0;
  state.collisions = [];
  if (!canvases.length) createCanvasPanels(state.compareMode ? 2 : 1);
  render();
  updateScrubber();
}

// ================================================================
//  Keyboard Shortcuts
// ================================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      state.playing ? stopPlayback() : startPlayback();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      stopPlayback();
      seekToFrame(state.frameIndex - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      stopPlayback();
      seekToFrame(state.frameIndex + 1);
      break;
    case 'ArrowUp':
      e.preventDefault();
      speedSlider.value = Math.min(7, parseInt(speedSlider.value) + 1);
      updateSpeedFromSlider();
      break;
    case 'ArrowDown':
      e.preventDefault();
      speedSlider.value = Math.max(0, parseInt(speedSlider.value) - 1);
      updateSpeedFromSlider();
      break;
    case 'KeyD':
      debugToggle.checked = !debugToggle.checked;
      state.showDebug = debugToggle.checked;
      render();
      break;
    case 'Home':
      e.preventDefault();
      stopPlayback();
      seekToFrame(0);
      break;
    case 'End':
      e.preventDefault();
      stopPlayback();
      seekToFrame(getTotalFrames() - 1);
      break;
  }
});

// ================================================================
//  File Input
// ================================================================
const fileInput = document.getElementById('fileInput');
if (fileInput) {
fileInput.addEventListener('change', async (e) => {
  const files = [...e.target.files].filter(f => f.name.endsWith('.json'));
  if (!files.length) return;

  stopPlayback();
  let firstData = null;

  for (const file of files) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.frames) continue;

      // Register in scenario index
      const scenario = data.scenario || file.name.split('_')[0];
      const baseName = file.name.replace('.json', '');
      const policy = data.policy || baseName.slice(baseName.indexOf('_') + 1);
      if (!state.scenarios[scenario]) state.scenarios[scenario] = [];
      if (!state.scenarios[scenario].includes(policy)) {
        state.scenarios[scenario].push(policy);
      }
      // Store data keyed by scenario+policy for dropdown loading
      if (!state.fileData) state.fileData = {};
      state.fileData[`${scenario}\t${policy}`] = data;

      if (!firstData) firstData = data;
    } catch (err) {
      console.warn('Skipping invalid file:', file.name, err.message);
    }
  }

  // Rebuild dropdowns
  populateScenarioSelect();
  if (firstData) {
    if (firstData.scenario) scenarioSelect.value = firstData.scenario;
    const policies = state.scenarios[firstData.scenario] || [];
    populatePolicySelect(policies);
    if (firstData.policy) policySelect.value = firstData.policy;

    state.data = firstData;
    state.frameIndex = 0;
    state.fractionalFrame = 0;
    if (!canvases.length) createCanvasPanels(1);
    render();
    updateScrubber();
    emptyState.style.display = 'none';
  }

  fileInput.value = '';
});
} else {
  console.warn('fileInput element not found');
}

// ================================================================
//  Drag & Drop
// ================================================================
canvasArea.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
canvasArea.addEventListener('drop', async (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) return;
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if (!data.frames) throw new Error('No frames in data');
    stopPlayback();

    // Register in scenario index
    const scenario = data.scenario || file.name.split('_')[0];
    const baseName = file.name.replace('.json', '');
    const policy = data.policy || baseName.slice(baseName.indexOf('_') + 1);
    if (!state.scenarios[scenario]) state.scenarios[scenario] = [];
    if (!state.scenarios[scenario].includes(policy)) {
      state.scenarios[scenario].push(policy);
    }
    if (!state.fileData) state.fileData = {};
    state.fileData[`${scenario}\t${policy}`] = data;

  state.collisions = []; // clear old collision effects
  state.data = data;
    state.frameIndex = 0;
    if (!canvases.length) createCanvasPanels(1);
    render();
    updateScrubber();
    emptyState.style.display = 'none';

    // Rebuild dropdowns
    populateScenarioSelect();
    scenarioSelect.value = scenario;
    populatePolicySelect(state.scenarios[scenario]);
    policySelect.value = policy;
  } catch (err) {
    alert(`Invalid JSON file: ${err.message}`);
  }
});

// ================================================================
//  Init
// ================================================================
updateSpeedFromSlider();
loadIndex();
</script>
</body>
</html>
